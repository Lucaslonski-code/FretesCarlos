    <!--

      é a forma recomendada pelo Google para descrever múltiplas entidades relacionadas
      (o mesmo negócio, o site, um serviço, o FAQ) sem gerar avisos de dados estruturados
      duplicados/conflitantes no Search Console.
    -->

          },

            "latitude": -25.4284,
            "longitude": -49.2733
          },
          "areaServed": [
            "Curitiba",
            "Colombo",
            "Pinhais",
            "São José dos Pinhais",
            "Araucária",

          ],
          "parentOrganization": { "@id": "https://www.carlosfretes.com.br/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://www.carlosfretes.com.br/#organization",
          "name": "Carlos Fretes",
          "url": "https://www.carlosfretes.com.br",
          "logo": "https://www.carlosfretes.com.br/logo.png",

            "Campo Largo",
            "Almirante Tamandaré",

            {
              "@type": "Question",
              "name": "Como é calculado o valor do orçamento do frete?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "O orçamento é calculado considerando a distância entre as cidades e bairros informados, o porte da mudança, a necessidade de ajudantes e o tipo de acesso no local. A estimativa final é gerada instantaneamente no site."
              }
            },
            {
              "@type": "Question",
              "name": "O motorista ajuda no carregamento e descarregamento?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim! O motorista sempre participa do serviço e auxilia no carregamento e descarregamento dos seus pertences sem custo extra além do frete regular."
              }
            },
            {
              "@type": "Question",
              "name": "Quando devo solicitar um ajudante adicional?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Se você tiver móveis muito pesados (como sofás grandes, geladeiras side-by-side, guarda-roupas pesados) ou escadas longas, vale a pena solicitar 1 ou 2 ajudantes adicionais para agilizar o serviço."
              }
            },
            {
              "@type": "Question",
              "name": "Qual é o valor mínimo do orçamento?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "O valor mínimo do orçamento é sempre de R$ 220,00, mesmo para trajetos curtos na mesma região. Esse valor garante a reserva e a mobilização inicial do veículo."
              }
            },
            {
              "@type": "Question",
              "name": "Quais são as formas de pagamento aceitas?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Aceitamos Pix, cartões de débito e crédito, além de pagamento em dinheiro no momento da entrega do serviço."
              }
            },
            {
              "@type": "Question",
              "name": "Qual a região de atendimento?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Atendemos todos os bairros de Curitiba, os 29 municípios da Região Metropolitana e viagens para o Litoral e interior."
